<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="flashCards.css">
        <link rel="icon" type="image/x-icon" href="bjornIcon.png">
    </head>
    <body>

        <div id="sidePanel">
            <div id="logoSection">
                <i class="fa-solid fa-bars"></i>
                <p>Björn AI Menu</p>
            </div>

            <div class="menuNavigationItem">
                <button class="menuNavButton">
                    <i class="fa-solid fa-chart-line"></i>
                    <p>Dashboard</p>
                </button>
            </div>
            
            <div class="menuNavigationItem">
                <button class="menuNavButton">
                    <i class="fa-solid fa-file-lines"></i>
                    <p>Notes</p>
                </button>
            </div>
            
            <div class="menuNavigationItem">
                <button class="menuNavButton">
                    <i class="fa-solid fa-note-sticky"></i>
                    <p>Flash Cards</p>
                </button>
            </div>

            <div class="menuNavigationItem">
                <button class="menuNavButton">
                    <i class="fa-solid fa-book-open"></i>
                    <p>Tutoring</p>
                </button>
            </div>

            <div class="menuNavigationItem">
                <button class="menuNavButton">
                    <i class="fa-solid fa-bullseye"></i>
                    <p>Practice</p>
                </button>
            </div>

            <div class="menuNavigationItem" id="updgradeSection">
                <button class="menuNavButton" id="upgradeAccountBtn">
                    <i class="fa-solid fa-coins"></i>
                    <p>Upgrade Accounts</p>
                </button>
            </div>

            <div class="menuNavigationItem" id="profileSection">
                <button class="menuNavButton" id="profileButton">
                    <i class="fa-solid fa-circle-user"></i>
                    <p>Profile</p>
                </button>
            </div>
        </div>

        <div id="mainPanel">

            <h2 id="pageTitle">Flashcards</h2>
            <p id="pageSubtitle">Create Flashcards to enhance your studying experience</p>

            <div id="lowerPageSection">
                
                <div id="flashcardsArea">
                    
                    <div class="flashcardsRow">
                        
                        <div class="flashcardsWrapper">
                            <button class="flashcardButton">
                                <div class="flashcardTitleWrppr">
                                    <img src="flashcardIco.png">
                                    <h3>Flash Cards</h3>
                                </div>

                                <div class="flashImageWrapper"></div>

                                <p>Math Unit 1(Pg1-10)</p>
                            </button>
                        </div>
                    </div>
                    
                </div>
                
                <div id="createFlashcardsArea">
                    
                    <h2 id="createFlashcardsTitle">Create New Flashcards</h2>
                </div>
                
            </div>
        </div>

        <script src="https://kit.fontawesome.com/cbd9f3e301.js" crossorigin="anonymous"></script>
    </body>
</html>
