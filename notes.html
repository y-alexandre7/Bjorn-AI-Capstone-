<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="notes.css">
        <link rel="icon" type="image/x-icon" href="bjornIcon.png">
    </head>
    <body>

        <div id="sidePanel">
            <div id="logoSection">
                <i class="fa-solid fa-bars"></i>
                <p>Björn AI Menu</p>
            </div>

            <div class="menuNavigationItem">
                <button class="menuNavButton">
                    <i class="fa-solid fa-chart-line"></i>
                    <p>Dashboard</p>
                </button>
            </div>
            
            <div class="menuNavigationItem">
                <button class="menuNavButton">
                    <i class="fa-solid fa-file-lines"></i>
                    <p>Notes</p>
                </button>
            </div>
            
            <div class="menuNavigationItem">
                <button class="menuNavButton">
                    <i class="fa-solid fa-note-sticky"></i>
                    <p>Flash Cards</p>
                </button>
            </div>

            <div class="menuNavigationItem">
                <button class="menuNavButton">
                    <i class="fa-solid fa-book-open"></i>
                    <p>Tutoring</p>
                </button>
            </div>

            <div class="menuNavigationItem">
                <button class="menuNavButton">
                    <i class="fa-solid fa-bullseye"></i>
                    <p>Practice</p>
                </button>
            </div>

            <div class="menuNavigationItem" id="updgradeSection">
                <button class="menuNavButton" id="upgradeAccountBtn">
                    <i class="fa-solid fa-coins"></i>
                    <p>Upgrade Accounts</p>
                </button>
            </div>

            <div class="menuNavigationItem" id="profileSection">
                <button class="menuNavButton" id="profileButton">
                    <i class="fa-solid fa-circle-user"></i>
                    <p>Profile</p>
                </button>
            </div>
        </div>

        <div id="mainPanel">
            
            <div id="searchBarArea">
                
                <div id="searchBarWrapper">
                    
                    <input placeholder="Search for folder" id="searchBarInput">
                    <button id="searchBarButton"><i class="fa-solid fa-magnifying-glass"></i> Search</button>
                    
                </div>
                
            </div>

            <div id="noteFolderSection">

                <div class="noteFolderRow" id="creativeFolderRow">
                    
                    <div class="noteFolderArea" id="createFolderArea">
                        <button id="createFolderButton">
                            
                            <div id="createFolderIconSect">
                                <img src="newNotesIcon.png">
                            </div>
                            
                            <div id="newNotesText">
                                <p>New Notebook</p>
                            </div>
                        </button>
                    </div>

                    <div class="noteFolderArea">
                        <button class="folderTemplateButton">
                            
                            <div class="folderTemplateIconSect">
                                <img src="mathNoteBook.png">
                            </div>
                            
                            <div class="folderTemplateText">
                                <p>Math Notes Template</p>
                            </div>
                        </button>
                    </div>
                </div>
                
            </div>
            
        </div>

        <script src="https://kit.fontawesome.com/cbd9f3e301.js" crossorigin="anonymous"></script>
    </body>
</html>
